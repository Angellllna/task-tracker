{% extends "base.html" %}
{% block content %}
  <div class="container mt-4">
    <h2>🗑️ Видалення завдання</h2>
    <p>Ви впевнені, що хочете видалити завдання <strong>"{{ object.title }}"</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Так, видалити</button>
      <a href="{% url 'tasks:task_list' %}" class="btn btn-secondary">Скасувати</a>
    </form>
  </div>
{% endblock %}
